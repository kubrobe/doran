name: Probe TTS and Vosk
on:
  push:
    branches: [duolingo-korean]
    paths: [".github/workflows/probe.yml", ".github/probe/**"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Vosk model to branch
        run: |
          curl -sSL -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-ko-0.22.zip
          unzip -q model.zip && find vosk-model-small-ko-0.22 -type f -exec ls -la {} \;
          mkdir push && cd push && git init -q -b model-cache
          cp -r ../vosk-model-small-ko-0.22 . 
          git config user.name ci && git config user.email ci@example.com
          git add -A && git commit -qm "Vosk small Korean model (cache for experiments)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" model-cache 2>&1 | tail -2
