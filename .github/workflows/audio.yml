name: Generate Korean audio
# Regenerates bundled audio whenever the course changes and commits it back.
on:
  push:
    branches: [duolingo-korean, main]
    paths: ["tools/audio_texts.json", "tools/gen_audio.py", ".github/workflows/audio.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: audio-${{ github.ref }}
  cancel-in-progress: false
jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y ffmpeg >/dev/null
      - run: pip install edge-tts sherpa-onnx numpy
      - run: python tools/gen_audio.py
      - name: Commit audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A app/src/main/assets/audio tools/audio_report.tsv
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Regenerate Korean audio"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
