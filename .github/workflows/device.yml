name: Device tests

# Boots Android emulators, runs the instrumented tests (audio, speech scoring, full lessons
# through the UI) and a random-tap crash check. Screenshots are pushed to the ci-screens branch.
on:
  push:
    branches: [main, duolingo-korean]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 34
            full: 1
            profile: pixel_6
          - api-level: 26
            full: 0
            profile: Nexus 4
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build app and test APKs
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          ram-size: 3072M
          profile: ${{ matrix.profile }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none -no-snapshot
          script: bash .github/scripts/device-tests.sh ${{ matrix.full }}
      - name: Publish screenshots and logs
        if: always()
        run: |
          mkdir -p /tmp/pub && cd /tmp/pub
          git init -q -b ci-screens
          mkdir -p api${{ matrix.api-level }}
          cp -r $GITHUB_WORKSPACE/out/* api${{ matrix.api-level }}/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Screens and logs from ${{ github.sha }} (API ${{ matrix.api-level }})" || exit 0
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-screens:ci-screens-api${{ matrix.api-level }}
